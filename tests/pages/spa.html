<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>SPA</title>
<style>body{margin:0;background:#fff;color:#222;font:16px sans-serif} #app{padding:12px} .row{background:#f2f2f2;border-bottom:1px solid #ddd;padding:6px}</style></head>
<body><div id="app"><h1>Loading…</h1></div>
<script>
  let n = 0;
  function route() { n++; document.getElementById('app').innerHTML = '<h1 style="color:#111">Route ' + n + '</h1>' + Array.from({ length: 30 }, (_, i) => '<div class="row">row ' + i + '</div>').join(''); }
  setTimeout(route, 300); setTimeout(route, 700);
  window.__route = route;
</script></body></html>
