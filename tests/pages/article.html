<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Plain article (light site)</title>
  <style>
    body { margin: 0; font: 16px/1.6 Georgia, serif; color: #222; }
    header { background: #f2f2f2; padding: 12px 24px; border-bottom: 1px solid #ccc; }
    main { max-width: 640px; margin: 0 auto; padding: 24px; }
    a { color: #0645ad; }
    .hero { height: 120px; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><rect width='40' height='40' fill='%23e63946'/><circle cx='20' cy='20' r='12' fill='%23f1faee'/></svg>"); color: #fff; padding: 12px; }
    .hero img { width: 40px; height: 40px; }
    .card { background: linear-gradient(#fff, #e8e8e8); border: 1px solid #ddd; padding: 12px; margin: 12px 0; }
    code { background: #eee; padding: 0 4px; }
  </style>
</head>
<body>
  <header><strong>Example Daily</strong> &middot; <a href="#">News</a></header>
  <main>
    <h1>A plain article on a light site</h1>
    <p>Lorem ipsum dolor sit amet, <a href="#">a link</a> and <code>inline code</code>.</p>
    <img id="photo" alt="photo" width="80" height="80" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><rect width='80' height='80' fill='%232a9d8f'/><circle cx='40' cy='40' r='25' fill='%23e9c46a'/></svg>">
    <picture id="pic"><source srcset="x.png" media="(min-width: 99999px)"><img id="picimg" alt="p" width="40" height="40" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><rect width='40' height='40' fill='%23264653'/></svg>"></picture>
    <canvas id="cv" width="60" height="30"></canvas>
    <div class="hero" id="hero">Hero text over image <img id="heroimg" alt="nested" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><rect width='40' height='40' fill='%23457b9d'/></svg>"></div>
    <div class="card" id="card">A card with a gradient background</div>
    <iframe id="frame" width="300" height="80" srcdoc="<body style='background:#fff;color:#000'>embedded frame</body>"></iframe>
  </main>
  <script>
    const c = document.getElementById('cv').getContext('2d');
    c.fillStyle = '#ffb703'; c.fillRect(0, 0, 60, 30);
  </script>
</body>
</html>
